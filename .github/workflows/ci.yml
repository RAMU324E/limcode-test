name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform-check:
    name: Compile and contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Typecheck webview
        run: npm run typecheck:webview

      - name: Check architecture contracts
        run: npm run check:contracts:plan

  linux-reliability-tests:
    name: Linux reliability tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tracked critical tests
        run: npm run test:ci:linux

  windows-runtime-tests:
    name: Windows runtime compatibility tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Run Windows storage and Wrapper regressions
        run: node --test --test-concurrency=1 tests/settingsRevisionConflict.test.cjs tests/reliable-kernel/windows-runtime-compatibility.test.mjs

  linux-vsix-surface:
    name: Linux and Windows VSIX package surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux VSIX
        run: npm run package:linux -- --out limcode-test-linux-x64-ci.vsix

      - name: Check Linux packaged files
        run: npm run check:package:surface -- --artifact limcode-test-linux-x64-ci.vsix

      - name: Build Windows VSIX
        run: npm run package:win32 -- --out limcode-test-win32-x64-ci.vsix

      - name: Check Windows packaged files
        run: npm run check:package:surface -- --artifact limcode-test-win32-x64-ci.vsix
